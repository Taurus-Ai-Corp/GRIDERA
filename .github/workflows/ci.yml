name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      # Guards the silent-skip: `turbo run test` ignores packages with no test
      # script, so an untested package would otherwise pass CI invisibly.
      # Must run BEFORE pnpm test — it explains what pnpm test is not covering.
      - run: pnpm assert:test-scripts
      - run: pnpm test
      - run: pnpm build
